[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "penampakan"
version = "0.1.0"
description = "Safe visual tool orchestration for text-only language models"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Penampakan contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "Pillow>=10",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.10; python_version < '3.12'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
transformers = ["transformers>=4.40,<5", "torch>=2.1"]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/penampakan"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "models: tests requiring downloaded model weights",
  "ocr: tests requiring a Tesseract installation",
]

[tool.coverage.run]
branch = true
source = ["penampakan"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["penampakan"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*", "pytesseract.*", "transformers.*", "torch.*"]
ignore_missing_imports = true
