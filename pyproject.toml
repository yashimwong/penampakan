[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "penampakan"
version = "0.4.0"
description = "Safe visual tool orchestration for text-only language models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Penampakan contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "Pillow>=10",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.10; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/yashimwong/penampakan"
Repository = "https://github.com/yashimwong/penampakan.git"
Documentation = "https://github.com/yashimwong/penampakan/tree/master/docs"
Changelog = "https://github.com/yashimwong/penampakan/blob/master/CHANGELOG.md"
Issues = "https://github.com/yashimwong/penampakan/issues"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
transformers = ["transformers>=4.40,<5", "torch>=2.1"]
# Provider lower bounds are the minimum versions exercised by CI that support
# the selected strict-output APIs; upper major bounds are pinned because none of
# these SDKs promises compatibility across a major release.
openai = ["openai>=2.54,<3"]
anthropic = ["anthropic>=0.121,<1"]
litellm = ["litellm>=1.96.2,<2"]
providers = ["penampakan[anthropic,litellm,openai]"]
benchmark = [
  "imageio>=2.31",
  "matplotlib>=3.8",
  "numpy>=1.23",
  "opencv-python-headless>=4.8",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/penampakan"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: real-dependency or real-weight integration tests",
  "integration_category(name): required integration outcome category",
  "models: tests requiring downloaded model weights",
  "ocr: tests requiring a Tesseract installation",
  "providers: tests requiring optional provider SDKs",
]

[tool.coverage.run]
source = ["penampakan"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["penampakan"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*", "pytesseract.*", "transformers.*", "torch.*"]
ignore_missing_imports = true

# Optional provider packages are absent on a base install, where strict type
# checking must still pass. Installed SDKs are checked against their real types
# because ignore_missing_imports only applies to an unresolved import.
[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "litellm.*"]
ignore_missing_imports = true

# Pillow's stubs pull in numpy, whose current stubs use 3.12-only syntax that
# cannot be parsed under the supported floor of python_version = "3.10".
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
