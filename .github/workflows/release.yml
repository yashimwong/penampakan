name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,providers]' -c requirements/provider-sdks.txt
      - name: Record the SQLite runtime version
        # Spec 07 D4: STRICT cache tables require SQLite 3.37+, and the durable
        # cache disables itself below that. Recording the runtime version makes
        # which path a job exercised visible in its log.
        run: >-
          python -c "import sqlite3;
          print('sqlite_version', sqlite3.sqlite_version);
          print('sqlite_version_info', sqlite3.sqlite_version_info)"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/penampakan
      - run: python scripts/check_links.py
      - run: pytest -m 'not models and not ocr and not providers' --cov=penampakan --cov-fail-under=90
      - run: >-
          pytest
          tests/unit/llms
          tests/contract/test_provider_adapters.py
          tests/integration/test_openai_sdk.py
          tests/integration/test_anthropic_sdk.py
          tests/integration/test_litellm_sdk.py

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/penampakan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Verify tag matches package version
        run: >-
          python -c "import tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert '${{ github.ref_name }}' == f'v{version}',
          f'tag ${{ github.ref_name }} does not match v{version}'"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
