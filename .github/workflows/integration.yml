name: integration

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "19 4 * * 1"
  release:
    types: [prereleased]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dependencies:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/huggingface
          key: >-
            integration-models-82a37760796d32b1411fe092ab5d4e227313294b-
            a2bb814dd30d776dcf7e30523b00659f4f141c71-
            fixtures-${{ hashFiles('tests/fixtures/licenses/**', 'tests/fixtures/natural/**') }}
      - run: docker build --file docker/integration.Dockerfile --tag penampakan-integration .
      - name: Prepare immutable model cache
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/.cache/huggingface:/cache/huggingface"
          -e HF_HOME=/cache/huggingface
          penampakan-integration
          python integration/prepare_models.py
      - name: Run required integration categories
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -v "${{ github.workspace }}/.cache/huggingface:/cache/huggingface"
          -e HF_HOME=/cache/huggingface
          -e HF_HUB_OFFLINE=1
          -e TRANSFORMERS_OFFLINE=1
          -e PENAMPAKAN_REQUIRE_INTEGRATION=ocr,geometry,caption,detection,e2e,cache
          penampakan-integration
          pytest -m integration tests/integration
